name: Build (WPF, legacy)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/Clipboard.Desktop/Clipboard.Desktop.csproj

      - name: Resolve application version
        id: app-version
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tag must use the vMAJOR.MINOR.PATCH format, got '$env:GITHUB_REF_NAME'."
            }
            $version = $Matches[1]
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: powershell
        run: .\build.ps1 -Version '${{ steps.app-version.outputs.version }}'

      - name: Build installer
        shell: powershell
        run: .\build-installer.ps1 -Version '${{ steps.app-version.outputs.version }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClipboard-${{ github.run_number }}
          path: |
            dist/OpenClipboard-*.zip
            dist/OpenClipboard-Setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenClipboard-*.zip
            dist/OpenClipboard-Setup-*.exe
          generate_release_notes: true
