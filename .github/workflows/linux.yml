name: Linux build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            deb_arch: amd64
          - rid: linux-arm64
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/OpenClipboard.App/OpenClipboard.App.csproj

      - name: Resolve application version
        id: app-version
        shell: bash
        run: |
          version="1.0.0"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Release tag must use the vMAJOR.MINOR.PATCH format, got '${GITHUB_REF_NAME}'." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test
        shell: bash
        run: dotnet test src/OpenClipboard.CrossPlatform.slnx --configuration Release -p:Version="${{ steps.app-version.outputs.version }}"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/OpenClipboard.App/OpenClipboard.App.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="${{ steps.app-version.outputs.version }}"

      - name: Package .deb
        shell: bash
        run: |
          chmod +x installer/linux/package-deb.sh
          installer/linux/package-deb.sh \
            "src/OpenClipboard.App/bin/Release/net10.0/${{ matrix.rid }}/publish" \
            "${{ steps.app-version.outputs.version }}" \
            "${{ matrix.deb_arch }}" \
            "artifacts/openclipboard_${{ steps.app-version.outputs.version }}_${{ matrix.deb_arch }}.deb"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.rid }}
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: Attach Linux packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Upload packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releaseReady=0
          for attempt in $(seq 1 90); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              releaseReady=1
              break
            fi
            sleep 10
          done
          if [[ "$releaseReady" -ne 1 ]]; then
            echo "GitHub Release '$GITHUB_REF_NAME' was not created." >&2
            exit 1
          fi

          packages=(dist/*.deb)
          if [[ "${#packages[@]}" -ne 2 ]]; then
            echo "Expected two Linux packages, found ${#packages[@]}." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber
