name: Windows build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/OpenClipboard.App/OpenClipboard.App.csproj

      - name: Resolve application version
        id: app-version
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tag must use the vMAJOR.MINOR.PATCH format, got '$env:GITHUB_REF_NAME'."
            }
            $version = $Matches[1]
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: dotnet test src/OpenClipboard.CrossPlatform.slnx --configuration Release "-p:Version=$env:APP_VERSION"

      - name: Publish
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: dotnet publish src/OpenClipboard.App/OpenClipboard.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true "-p:Version=$env:APP_VERSION"

      - name: Package publish output
        shell: pwsh
        env:
          PUBLISH_DIR: src/OpenClipboard.App/bin/Release/net10.0/${{ matrix.rid }}/publish
          PACKAGE_PATH: artifacts/OpenClipboard-${{ matrix.rid }}-${{ steps.app-version.outputs.version }}.zip
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR/*" -DestinationPath $env:PACKAGE_PATH -CompressionLevel Optimal
          if (-not (Test-Path $env:PACKAGE_PATH)) {
            throw "Package was not created: $env:PACKAGE_PATH"
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisPath\makensis.exe")) {
            throw "makensis.exe not found at $nsisPath"
          }
          echo $nsisPath >> $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          PUBLISH_DIR: src/OpenClipboard.App/bin/Release/net10.0/${{ matrix.rid }}/publish
        run: |
          $arch = "${{ matrix.rid }}".Replace("win-", "")
          $fileVersion = "$env:APP_VERSION.0"
          $sourceDir = (Resolve-Path $env:PUBLISH_DIR).Path
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          makensis /DARCH=$arch /DVERSION=$env:APP_VERSION /DFILEVERSION=$fileVersion /DSOURCE_DIR=$sourceDir installer/OpenClipboard.App.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
          $setup = "dist/OpenClipboard.App-Setup-$arch-$env:APP_VERSION.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer was not created: $setup"
          }
          Copy-Item $setup artifacts/

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
          if-no-files-found: error

  release:
    name: Attach Windows packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: win-*
          path: dist
          merge-multiple: true

      - name: Upload packages to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseReady = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseReady = $true
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $releaseReady) {
            throw "GitHub Release '$env:GITHUB_REF_NAME' was not created."
          }

          $packages = @(
            Get-ChildItem -Path dist -Filter '*.zip' | ForEach-Object { $_.FullName }
            Get-ChildItem -Path dist -Filter '*.exe' | ForEach-Object { $_.FullName }
          )
          if ($packages.Count -ne 4) {
            throw "Expected four Windows packages (2 zip + 2 exe), found $($packages.Count)."
          }
          gh release upload $env:GITHUB_REF_NAME @packages --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload Windows packages to the GitHub Release."
          }
